name: Backend Tests

on:
  workflow_call:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install UV
        run: python -m pip install uv

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run unit tests only
        working-directory: backend
        run: uv run python -m pytest -v -m "not e2e"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install UV
        run: python -m pip install uv

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run E2E tests only
        working-directory: backend
        run: uv run python -m pytest -v -m "e2e"
